# ── Linter Python : ruff ─────────────────────────────────────
# Configuration posée le 2026-08-12.
#
# Ce dépôt n'a pas de venv sur la VM de développement : il ne tourne qu'en
# conteneur. Pour le passer à la main, le ruff du dépôt voisin fait
# l'affaire — c'est un binaire autonome, il n'importe pas le code analysé :
#
#   ../docsearch-api/.venv/bin/ruff check .
#   ../docsearch-api/.venv/bin/ruff check --fix .
#
# ruff tournait DÉJÀ ici : .github/workflows/ci.yml lance `ruff check app/`
# depuis toujours, mais sans fichier de configuration — donc sur les seules
# règles par défaut (E4, E7, E9, F). Ce fichier rend ce choix explicite et
# l'élargit un peu.
#
# Le formateur (`ruff format`) n'est PAS activé : le dépôt n'a jamais été
# formaté automatiquement, et le faire d'un coup réécrirait tout pour zéro
# défaut corrigé.

line-length = 120

# L'image est en `FROM python:3.12-slim` et la CI aussi. C'est ce Python-là
# qui décide de ce que le code a le droit d'écrire, pas celui de la VM.
target-version = "py312"

[lint]
# Au-delà des règles par défaut (E4/E7/E9 + F) :
#   B    bugbear — pièges réels (mutable par défaut, zip non strict…)
#   C4   comprehensions inutiles
#   SIM  simplifications sûres
#
# E501 (ligne trop longue) reste dehors : 127 signalements pour un 95e
# centile réel à 80 caractères. `line-length` ci-dessus est la cible si on
# l'active un jour.
select = ["E4", "E7", "E9", "F", "B", "C4", "SIM"]

ignore = [
    # try/except/pass → contextlib.suppress. Préférence de style, pas un
    # défaut : 1 occurrence.
    "SIM105",

    # Imports non regroupés en tête de module. Les modules de app/ sont à
    # plat (COPY app/ . dans le Dockerfile) et s'importent entre eux après
    # avoir ajusté sys.path ou lu leur environnement. 98 signalements pour
    # une structure assumée : la règle ne dit rien d'utile ici.
    "E402",

    # Plusieurs instructions sur une ligne : mêmes tables de correspondance
    # alignées que dans docsearch-api. 9 signalements, aucun défaut.
    "E701",

    # `raise ... ` dans un `except` sans `from err`. 1 occurrence, gardée
    # cohérente avec docsearch-api où la règle attend un lot à part.
    "B904",
]
