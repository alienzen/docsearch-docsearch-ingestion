[pytest]
testpaths = tests
# `app` est dans sys.path via tests/conftest.py — les modules de
# l'ingestion sont à plat (COPY app/ . dans le Dockerfile), pas dans un
# paquet.
addopts = -q --strict-markers
markers =
    requires_es: exige un Elasticsearch joignable (ES_HOST) — se saute proprement sinon
